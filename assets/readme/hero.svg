<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">dotfiles-niri-config — Niri + Noctalia rice</title>
  <desc id="desc">Un rice modular de Niri con noctalia-shell: barra, launcher, overview y theming, instalable con un comando. Se muestra un mockup del escritorio con la barra, una terminal ejecutando ./install.sh y paneles.</desc>

  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8AEFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#A8AEFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="26" fill="#0C0D11"/>
  <rect width="1200" height="400" rx="26" fill="url(#glow)"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="60" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" letter-spacing="3" fill="#5A5E75">NIRI · NOCTALIA — WAYLAND RICE</text>

    <text x="60" y="128" font-size="56" font-weight="700" fill="#E8E9F3">dotfiles-niri-config</text>

    <text x="60" y="172" font-size="21" fill="#8B8FA8">A modular Niri + Noctalia Wayland rice.</text>
    <text x="60" y="200" font-size="21" fill="#8B8FA8">Bar, launcher, overview and theming — one command to install.</text>

    <g id="chips" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#B9BCE0">
      <rect x="60" y="234" width="118" height="30" rx="8" fill="#15171F"/>
      <text x="78" y="254">arch linux</text>

      <rect x="190" y="234" width="72" height="30" rx="8" fill="#15171F"/>
      <text x="208" y="254">niri</text>

      <rect x="274" y="234" width="128" height="30" rx="8" fill="#15171F"/>
      <text x="292" y="254" fill="#A8AEFF">noctalia v5</text>

      <rect x="414" y="234" width="112" height="30" rx="8" fill="#15171F"/>
      <text x="432" y="254">quickshell</text>
    </g>
  </g>

  <g id="desktop-proof" transform="translate(700 44)">
    <g id="bar" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect x="0" y="0" width="440" height="30" rx="10" fill="#15171F"/>
      <rect x="16" y="12" width="10" height="6" rx="3" fill="#A8AEFF"/>
      <rect x="32" y="12" width="10" height="6" rx="3" fill="#2A2D3A"/>
      <rect x="48" y="12" width="10" height="6" rx="3" fill="#2A2D3A"/>
      <rect x="66" y="9" width="1.5" height="12" rx="0.75" fill="#2A2D3A"/>
      <text x="424" y="19" font-size="11" fill="#8B8FA8" text-anchor="end">14:20</text>
    </g>

    <g id="window-tile" transform="rotate(-4 190 60)">
      <rect x="160" y="34" width="256" height="132" rx="12" fill="#1A1D27"/>
      <rect x="160" y="34" width="256" height="26" rx="12" fill="#21242F"/>
      <rect x="160" y="48" width="256" height="12" fill="#21242F"/>
      <circle cx="176" cy="47" r="4" fill="#2A2D3A"/>
      <circle cx="190" cy="47" r="4" fill="#2A2D3A"/>
      <circle cx="204" cy="47" r="4" fill="#2A2D3A"/>
      <rect x="176" y="74" width="60" height="8" rx="4" fill="#2A2D3A"/>
      <rect x="176" y="92" width="180" height="8" rx="4" fill="#232635"/>
      <rect x="176" y="108" width="150" height="8" rx="4" fill="#232635"/>
      <rect x="176" y="124" width="168" height="8" rx="4" fill="#232635"/>
    </g>

    <g id="launcher-card" transform="rotate(3 330 130)">
      <rect x="250" y="112" width="180" height="120" rx="12" fill="#1A1D27"/>
      <rect x="266" y="128" width="148" height="24" rx="12" fill="#21242F"/>
      <circle cx="278" cy="140" r="4" fill="#A8AEFF"/>
      <rect x="290" y="162" width="30" height="22" rx="6" fill="#21242F"/>
      <rect x="326" y="162" width="30" height="22" rx="6" fill="#21242F"/>
      <rect x="362" y="162" width="30" height="22" rx="6" fill="#21242F"/>
      <rect x="290" y="192" width="30" height="22" rx="6" fill="#21242F"/>
      <rect x="326" y="192" width="30" height="22" rx="6" fill="#21242F"/>
      <rect x="362" y="192" width="30" height="22" rx="6" fill="#21242F"/>
    </g>

    <g id="terminal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect x="0" y="52" width="340" height="168" rx="12" fill="#15171F"/>
      <rect x="0" y="52" width="340" height="30" rx="12" fill="#1B1E28"/>
      <rect x="0" y="70" width="340" height="12" fill="#1B1E28"/>
      <circle cx="18" cy="67" r="4" fill="#FF5F56"/>
      <circle cx="32" cy="67" r="4" fill="#FFBD2E"/>
      <circle cx="46" cy="67" r="4" fill="#27C93F"/>
      <text x="170" y="71" font-size="11" fill="#5A5E75" text-anchor="middle">zsh</text>

      <text x="20" y="108" font-size="13" fill="#E8E9F3"><tspan fill="#A8AEFF">$ </tspan>./install.sh</text>
      <text x="20" y="134" font-size="13" fill="#8B8FA8">:: dotfiles enlazados vía stow</text>
      <text x="20" y="160" font-size="13" fill="#8B8FA8">:: noctalia config validada</text>
      <text x="20" y="188" font-size="13" fill="#7EE787">✔ setup completado</text>
    </g>
  </g>
</svg>