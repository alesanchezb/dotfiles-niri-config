# Noctalia v5 config
# El resto de ajustes se pueden tocar desde Settings (se guardan en
# ~/.local/state/noctalia/settings.toml, que gana sobre este archivo).

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "~/Pictures/wallpapers"

[widget.media]
art_size = 20
title_scroll = "on_hover"
hide_when_no_media = true

# Fondo difuminado del overview (layer noctalia-backdrop, requiere la
# layer-rule en niri/window-rules.kdl: place-within-backdrop true).
[backdrop]
enabled = true
blur_intensity = 0.5
tint_intensity = 0.3

# Notificaciones: noctalia actúa como daemon de org.freedesktop.Notifications.
# Es importante que dunst/swaync estén enmascarados (systemctl --user mask dunst)
# para que no le roben el nombre por activación DBus.
[notification]
enable_daemon = true
show_app_name = true
show_actions = true
position = "top_center"
layer = "top"

# Navegación de paneles y launcher (estilo emacs: Ctrl+n/Ctrl+p para mover el
# cursor de selección; se suman a las teclas de flecha por defecto).
[keybinds]
cancel       = ["Escape"]
copy         = ["Ctrl+c"]
delete       = ["Delete"]
down         = ["Down", "Ctrl+n"]
left         = ["Left"]
right        = ["Right"]
save         = ["Ctrl+s"]
tab_next     = ["Tab"]
tab_previous = ["Shift+ISO_Left_Tab"]
up           = ["Up", "Ctrl+p"]
validate     = ["Return", "KP_Enter", "space"]

# Barra: lista por defecto + widget del plugin game-launcher
[bar.default]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "alexander/game-launcher:launcher",
    "control-center",
    "session",
]

[plugins]
auto_update = true
enabled = [
    "alexander/game-launcher",
    "noctalia/wallhaven",
]

[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
enabled = true

[[plugins.source]]
name = "community"
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
enabled = true

